name: Deploy to Production

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'infra/**'
      - '.github/workflows/deploy.yml'

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Install dependencies
        run: npm ci

      - name: Build Admin UI
        run: |
          cd apps/gallery-admin
          npm install
          npm run build

      - name: Build Viewer UI
        run: |
          cd apps/gallery-viewer
          npm install
          npm run build

      - name: Build API
        run: |
          cd apps/gallery-api
          mvn clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker image
        run: |
          docker build -t vie-gallery-api:latest -f infra/Dockerfile.api .
          docker save vie-gallery-api:latest | gzip > vie-gallery-api.tar.gz

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Create deployment directories
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "mkdir -p ~/vie-gallery/{admin,viewer,infra}"

      - name: Transfer Admin UI
        run: |
          rsync -avz --delete apps/gallery-admin/dist/ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:~/vie-gallery/admin/

      - name: Transfer Viewer UI
        run: |
          rsync -avz --delete apps/gallery-viewer/dist/ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:~/vie-gallery/viewer/

      - name: Transfer Infrastructure configs
        run: |
          scp infra/docker-compose.production.yml ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:~/vie-gallery/infra/
          scp infra/nginx-admin.conf ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:~/vie-gallery/infra/
          scp infra/nginx-viewer.conf ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:~/vie-gallery/infra/
          scp infra/nginx-prod-ssl.conf ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:~/vie-gallery/infra/

      - name: Transfer API Docker image
        run: |
          scp vie-gallery-api.tar.gz ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:~/vie-gallery/

      - name: Deploy to server
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'ENDSSH'
          set -e
          cd ~/vie-gallery

          # Load Docker image
          docker load < vie-gallery-api.tar.gz
          rm vie-gallery-api.tar.gz

          cd infra

          # Fail fast: .env.production must exist and contain every variable the
          # API needs at boot. A missing variable used to surface only later as
          # a 502 from Nginx, after the API container had crashed in a loop.
          if [ ! -f .env.production ]; then
            echo "ERROR: ~/vie-gallery/infra/.env.production not found on server" >&2
            exit 1
          fi
          for var in \
            GALLERY_SECURITY_ENCRYPTION_SECRET \
            GALLERY_SECURITY_ENCRYPTION_SALT \
            GALLERY_SECURITY_JWT_SECRET \
            ALIYUN_OSS_ENDPOINT \
            ALIYUN_OSS_ACCESS_KEY_ID \
            ALIYUN_OSS_ACCESS_KEY_SECRET \
            ALIYUN_OSS_BUCKET; do
            if ! grep -q "^${var}=.\+" .env.production; then
              echo "ERROR: ${var} is missing or empty in .env.production" >&2
              exit 1
            fi
          done

          # Recreate only containers whose configuration changed, so
          # mysql/redis/minio keep running across deploys. --env-file is what
          # feeds the compose variables; without it the API boots with empty
          # secrets and Nginx answers every request with 502.
          
          # Start all containers and wait for health checks. Flyway runs
          # automatically inside the API container on boot and is the single
          # source of truth for schema changes — no manual SQL is applied
          # here. The API's compose healthcheck already depends on mysql
          # being service_healthy first, so there is no need to poll MySQL
          # separately before this.
          echo "Starting containers and waiting for health checks..."
          docker compose -f docker-compose.production.yml --env-file .env.production up -d --wait --wait-timeout 240
          
          # If health check still fails, get detailed logs
          if [ $? -ne 0 ]; then
            echo "::group::API Container Logs"
            docker logs vie-gallery-api --tail 100
            echo "::endgroup::"
            
            echo "::group::API Health Check Details"
            docker inspect vie-gallery-api --format='{{json .State.Health}}' | jq '.'
            echo "::endgroup::"
            
            echo "::group::Database Migration Status"
            docker exec vie-gallery-mysql mysql -uvie_user -pvie_password_2026 vie_gallery \
              -e "SELECT version, description, installed_on, success FROM flyway_schema_history ORDER BY installed_rank DESC LIMIT 5;"
            echo "::endgroup::"
            
            exit 1
          fi

          docker compose -f docker-compose.production.yml --env-file .env.production ps
          docker logs vie-gallery-api --tail=30 || true

          # Configure Nginx (SSL version; requires Let's Encrypt certs from setup-ssl.sh)
          sudo cp nginx-prod-ssl.conf /etc/nginx/sites-available/vie-gallery
          sudo ln -sf /etc/nginx/sites-available/vie-gallery /etc/nginx/sites-enabled/
          sudo nginx -t
          sudo systemctl reload nginx

          echo "Deployment completed successfully!"
          ENDSSH

      - name: Post-deployment database check
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'ENDSSH'
          cd ~/vie-gallery/infra
          echo "Checking Flyway migration status..."
          docker exec vie-gallery-mysql mysql -uvie_user -pvie_password_2026 vie_gallery \
            -e "SELECT version, description, success, installed_on FROM flyway_schema_history ORDER BY installed_rank DESC LIMIT 5;" \
            || echo "WARNING: Could not query Flyway history"
          
          echo "Verifying critical schema changes..."
          docker exec vie-gallery-mysql mysql -uvie_user -pvie_password_2026 vie_gallery \
            -e "SELECT COUNT(*) as raw_token_exists FROM INFORMATION_SCHEMA.COLUMNS WHERE TABLE_SCHEMA='vie_gallery' AND TABLE_NAME='share_link' AND COLUMN_NAME='raw_token';" \
            || echo "WARNING: Could not verify schema"
          ENDSSH

      - name: Verify deployment
        run: |
          ok=0
          for i in $(seq 1 18); do
            if ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "curl -fsS http://localhost:8088/actuator/health > /dev/null 2>&1"; then
              echo "API healthy on :8088"
              ok=1
              break
            fi
            echo "Waiting for API to become healthy... ($i/18)"
            sleep 5
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::API did not become healthy within 90s"
            echo "::group::API Container Logs"
            ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "docker logs vie-gallery-api --tail=150" || true
            echo "::endgroup::"
            
            echo "::group::Container Health Status"
            ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "docker inspect vie-gallery-api --format='{{json .State.Health}}'" || true
            echo "::endgroup::"
            
            echo "::group::Recent Flyway Migrations"
            ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "cd ~/vie-gallery/infra && docker exec vie-gallery-mysql mysql -uvie_user -pvie_password_2026 vie_gallery -e 'SELECT version, description, success FROM flyway_schema_history ORDER BY installed_rank DESC LIMIT 3;'" || true
            echo "::endgroup::"
            
            exit 1
          fi
          
          # Test API endpoint through Nginx
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "curl -fsS -H 'Host: gallery.vie-vibe.cn' http://localhost/api/auth/csrf > /dev/null" \
            && echo "Nginx -> API proxy OK" \
            || { echo "::error::Nginx -> API proxy check failed"; exit 1; }
          
          echo "✓ Deployment verification passed"
