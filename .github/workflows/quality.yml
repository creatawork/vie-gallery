name: Quality

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Install dependencies
        run: npm ci

      - name: Check documentation links
        run: npm run check:docs

      - name: Run frontend type checks
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Run backend tests
        run: mvn -B -ntp -f apps/gallery-api/pom.xml test

      # Note: Real MySQL/Redis/MinIO integration tests are tracked separately as part of P0-01.
      # This workflow currently covers unit tests, type safety, builds, and documentation links.
