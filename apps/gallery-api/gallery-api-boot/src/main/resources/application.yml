spring:
  application:
    name: gallery-api
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:13306/vie_gallery?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USERNAME:vie}
    password: ${DB_PASSWORD:vie_local}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    validate-on-migrate: true
  session:
    store-type: redis
    timeout: ${SESSION_TTL:7d}
    redis:
      namespace: vie:session:v2
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:100MB}
      max-request-size: ${MAX_REQUEST_SIZE:500MB}
server:
  port: 8080
  servlet:
    session:
      cookie:
        name: VIE_SESSION
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

gallery:
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${STORAGE_ACCESS_KEY:vie_local}
    secret-key: ${STORAGE_SECRET_KEY:vie_local_secret}
    bucket: ${STORAGE_BUCKET:vie-gallery}
  quota:
    max-bytes: ${QUOTA_MAX_BYTES:5368709120}
    max-photos: ${QUOTA_MAX_PHOTOS:10000}
    max-file-size: ${MAX_FILE_SIZE_BYTES:104857600}
    max-pixels: ${MAX_IMAGE_PIXELS:40000000}
    max-batch: ${MAX_BATCH_FILES:50}
  processing:
    poll-interval: ${PHOTO_PROCESSING_POLL_INTERVAL:5000}
    max-retries: ${PHOTO_PROCESSING_MAX_RETRIES:3}
