<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>陈屿摄影 · 素笺模板 T0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --text:#1A1A1A; --muted:#8A8A86; --hairline:#ECECEA;
  --primary:#1F6E68; --on-primary:#FFFFFF;
  --font-display:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  --font-body:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  --maxw:1080px; --radius:8px; --space-section:112px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);
  font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 32px}
body .wrap{padding-left:32px;padding-right:32px}

/* nav */
.nav{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--hairline)}
.nav-in{max-width:var(--maxw);margin:0 auto;padding:18px 32px;display:flex;align-items:center;justify-content:space-between}
.wordmark{font-weight:700;font-size:17px;letter-spacing:.06em}
.nav-links{display:flex;gap:28px;font-size:14px;color:var(--muted)}
.nav-links a{transition:color .2s}
.nav-links a:hover,.nav-links a:focus-visible{color:var(--text)}
:focus-visible{outline:2px solid var(--primary);outline-offset:3px;border-radius:2px}

/* hero */
.hero{max-width:1180px;margin:0 auto;padding:40px 32px 0}
.hero-media{position:relative;border-radius:var(--radius);overflow:hidden;aspect-ratio:16/8.5}
.hero-media img{width:100%;height:100%;object-fit:cover}
.hero-copy{position:absolute;inset:auto 0 0 0;padding:72px 44px 40px;
  background:linear-gradient(180deg,transparent,rgba(10,20,19,.55))}
.hero h1{color:#fff;font-family:var(--font-display);font-weight:700;font-size:clamp(28px,4.2vw,46px);
  letter-spacing:.04em;line-height:1.3}
.hero p{color:rgba(255,255,255,.85);font-size:15px;font-weight:300;margin-top:8px}

/* sections */
section{padding-top:var(--space-section)}
.sec-label{display:flex;align-items:baseline;gap:16px;margin-bottom:40px}
.sec-label h2{font-size:15px;font-weight:500;letter-spacing:.28em;color:var(--text)}
.sec-label::after{content:"";flex:1;height:1px;background:var(--hairline)}

/* projects mosaic */
.mosaic{display:grid;grid-template-columns:1fr 1fr;gap:40px 32px}
.card{display:block}
.card .ph{border-radius:var(--radius);overflow:hidden;aspect-ratio:4/3;background:#F2F2F0}
.card img{width:100%;height:100%;object-fit:cover;transition:transform .6s ease}
.card:hover img{transform:scale(1.025)}
.card h3{font-size:17px;font-weight:500;margin-top:16px;letter-spacing:.02em}
.card p{font-size:13px;color:var(--muted);margin-top:2px}

/* about */
.about{display:grid;grid-template-columns:280px 1fr;gap:56px;align-items:start}
.about .ph{border-radius:var(--radius);overflow:hidden;aspect-ratio:4/5}
.about img{width:100%;height:100%;object-fit:cover}
.about figcaption{font-size:12px;color:var(--muted);margin-top:10px}
.about-text{max-width:520px}
.about-text p{font-size:16.5px;font-weight:300;color:#3B3B38}
.about-text .sig{margin-top:24px;font-size:14px;color:var(--muted)}

/* contact */
.contact{max-width:560px;margin:0 auto;text-align:center}
.contact .lead{font-size:22px;font-weight:500;letter-spacing:.04em}
.wechat-row{display:flex;align-items:center;justify-content:center;gap:14px;margin:28px 0 14px}
.wechat-id{font-size:18px;letter-spacing:.08em;border-bottom:1px dashed #C9C9C4;padding-bottom:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;cursor:pointer;
  font-family:inherit;font-size:14px;letter-spacing:.06em;border-radius:999px;
  transition:background .2s,color .2s,border-color .2s}
.btn-primary{background:var(--primary);color:var(--on-primary);padding:14px 36px}
.btn-primary:hover{background:#175A55}
.btn-ghost{background:none;color:var(--text);padding:12px 26px;border:1px solid #D8D8D3}
.btn-ghost:hover{border-color:var(--text)}
.btn-copy{background:none;color:var(--primary);padding:8px 16px;border:1px solid #BEDAD7}
.btn-copy:hover{background:#F0F7F6}
.contact .hint{font-size:13px;color:var(--muted)}
/* form */
.form{margin-top:48px;text-align:left;display:grid;gap:20px}
.form label{font-size:13px;color:var(--muted);display:block;margin-bottom:8px}
.form input,.form textarea{width:100%;border:1px solid #E0E0DB;border-radius:var(--radius);
  padding:13px 16px;font-family:inherit;font-size:15px;color:var(--text);background:#FCFCFB;resize:vertical}
.form input:focus,.form textarea:focus{outline:none;border-color:var(--primary)}
.form .actions{display:flex;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:36px;transform:translateX(-50%) translateY(16px);opacity:0;
  background:#1A1A1A;color:#fff;font-size:14px;padding:11px 22px;border-radius:999px;
  transition:all .3s;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* footer */
footer{margin-top:var(--space-section);border-top:1px solid var(--hairline);padding:32px 0 40px;
  font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between}

/* reveal motion */
.reveal{opacity:0;transform:translateY(12px);transition:opacity .7s ease,transform .7s ease}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  .reveal{opacity:1;transform:none;transition:none}
  html{scroll-behavior:auto}
  .card img{transition:none}
}

@media (max-width:720px){
  body .wrap{padding-left:20px;padding-right:20px}
  .nav-in{padding:16px 20px}
  .hero{padding:20px 20px 0}
  :root{--space-section:72px}
  .mosaic{grid-template-columns:1fr;gap:36px}
  .about{grid-template-columns:1fr;gap:28px}
  .about .ph{max-width:300px}
  footer{flex-direction:column;gap:6px}
}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-in">
    <a class="wordmark" href="#top">陈屿摄影</a>
    <div class="nav-links">
      <a href="#projects">项目</a><a href="#about">关于</a><a href="#contact">联系</a>
    </div>
  </div>
</nav>

<header class="hero" id="top">
  <div class="hero-media">
    <img src="assets/p_1011.jpg" alt="清晨湖面上划独木舟的人">
    <div class="hero-copy">
      <h1>用镜头收藏山与海</h1>
      <p>人像与旅行摄影，现居厦门。拍了九年海，也在拍去海边的人。</p>
    </div>
  </div>
</header>

<main class="wrap">

  <section id="projects" class="reveal">
    <div class="sec-label"><h2>精选项目</h2></div>
    <div class="mosaic">
      <a class="card" href="#projects">
        <div class="ph"><img src="assets/p_1057.jpg" alt="海岸悬崖与绿色海面"></div>
        <h3>海岸线的一天</h3><p>2025 · 东山岛</p>
      </a>
      <a class="card" href="#projects">
        <div class="ph"><img src="assets/p_1049.jpg" alt="平静海面上的孤岛倒影"></div>
        <h3>岛屿清晨</h3><p>2024 · 涠洲岛</p>
      </a>
      <a class="card" href="#projects">
        <div class="ph"><img src="assets/p_431.jpg" alt="木桌上的咖啡与点心"></div>
        <h3>祖母的厨房</h3><p>2025 · 家中</p>
      </a>
      <a class="card" href="#projects">
        <div class="ph"><img src="assets/p_1021.jpg" alt="雾气笼罩的山林"></div>
        <h3>雾进山里的时候</h3><p>2023 · 武夷山</p>
      </a>
    </div>
  </section>

  <section id="about" class="reveal">
    <div class="sec-label"><h2>关于我</h2></div>
    <div class="about">
      <figure>
        <div class="ph"><img src="assets/p_1000.jpg" alt="站在山脊雾线上的摄影师"></div>
        <figcaption>在等一场没来的日出 · 2024</figcaption>
      </figure>
      <div class="about-text">
        <p>你好，我是陈屿。白天拍海和山，晚上整理底片。</p>
        <p style="margin-top:14px">比起布光，我更相信等待——等一场雾、一次涨潮、一个没看镜头的人。</p>
        <p class="sig">人像 / 旅行 / 小型商业委托 · 全国可约</p>
      </div>
    </div>
  </section>

  <section id="contact" class="reveal">
    <div class="contact">
      <p class="lead">想拍点什么？</p>
      <div class="wechat-row">
        <span class="wechat-id">微信：chenyu-photo</span>
        <button class="btn btn-copy" data-copy="chenyu-photo">复制</button>
      </div>
      <p class="hint">复制微信号去添加，或直接留言：</p>
      <form class="form" id="contactForm">
        <div><label for="fname">怎么称呼你</label><input id="fname" required placeholder="称呼 / 昵称"></div>
        <div><label for="fmsg">想拍什么，或想说的话</label><textarea id="fmsg" rows="4" required placeholder="时间、地点、大概的想法都可以写在这里"></textarea></div>
        <div class="actions"><button class="btn btn-primary" type="submit">发送留言</button></div>
      </form>
    </div>
  </section>

</main>

<footer class="wrap">
  <span>© 2026 陈屿摄影</span>
  <span>厦门 · 可全国约拍</span>
</footer>

<div class="toast" id="toast" role="status"></div>

<script>
const toast=document.getElementById('toast');let t;
function showToast(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(t);t=setTimeout(()=>toast.classList.remove('show'),2400)}
document.querySelectorAll('[data-copy]').forEach(b=>b.addEventListener('click',()=>{
  (navigator.clipboard?navigator.clipboard.writeText(b.dataset.copy):Promise.reject()).then(()=>showToast('微信号已复制'))
  .catch(()=>showToast('复制失败，请手动复制：'+b.dataset.copy))
}));
document.getElementById('contactForm').addEventListener('submit',e=>{
  e.preventDefault();showToast('留言已记录（原型演示，不会真的发送）');e.target.reset()
});
const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}}),{threshold:.12});
document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
</script>
</body>
</html>
