server {
    listen 80;
    server_name _;

    client_max_body_size 500M;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Fixed upstream only: signed OSS reads without browser CORS restrictions.
    location ^~ /oss/ {
        limit_except GET HEAD { deny all; }
        proxy_pass https://vie-gallery.oss-cn-hangzhou.aliyuncs.com/;
        proxy_ssl_server_name on;
        proxy_ssl_name vie-gallery.oss-cn-hangzhou.aliyuncs.com;
        proxy_set_header Host vie-gallery.oss-cn-hangzhou.aliyuncs.com;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header Referer "https://gallery.vie-vibe.cn/";
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        proxy_cache off;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location /api/ {
        proxy_pass http://gallery-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
