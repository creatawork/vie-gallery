server {
    listen 80;
    server_name gallery.vie-vibe.cn;

    client_max_body_size 100M;

    # API 后端
    location /api/ {
        proxy_pass http://localhost:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support (如果需要)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 管理端 (Admin UI)
    location /app/ {
        proxy_pass http://localhost:5173/app/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin UI 静态资源
    location /assets/ {
        proxy_pass http://localhost:5173/assets/;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /covers/ {
        proxy_pass http://localhost:5173/covers/;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /presets/ {
        proxy_pass http://localhost:5173/presets/;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /textures/ {
        proxy_pass http://localhost:5173/textures/;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Admin UI 图片文件
    location ~ ^/(.*\.(png|jpg|jpeg|gif|svg|ico))$ {
        proxy_pass http://localhost:5173/$1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 公开展示端 (Viewer UI)
    location /g/ {
        proxy_pass http://localhost:5174/g/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 根路径重定向到管理端
    location = / {
        return 302 /app/;
    }
}
