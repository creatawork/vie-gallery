server {
    listen 80;
    server_name gallery.vie-vibe.cn;

    client_max_body_size 100M;

    # API 后端
    # Fixed upstream only: signed OSS reads without browser CORS restrictions.
    location ^~ /oss/ {
        limit_except GET HEAD { deny all; }
        proxy_pass https://vie-gallery.oss-cn-hangzhou.aliyuncs.com/;
        proxy_ssl_server_name on;
        proxy_ssl_name vie-gallery.oss-cn-hangzhou.aliyuncs.com;
        proxy_set_header Host vie-gallery.oss-cn-hangzhou.aliyuncs.com;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header Referer "https://gallery.vie-vibe.cn/";
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        proxy_cache off;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location /api/ {
        proxy_pass http://localhost:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support (如果需要)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 短链接公开重定向（GET /s/{shortCode} -> 302）
    location /s/ {
        proxy_pass http://localhost:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 管理端 (Admin UI)
    location /app/ {
        proxy_pass http://localhost:5173/app/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin UI 静态资源
    location /assets/ {
        proxy_pass http://localhost:5173/assets/;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /covers/ {
        proxy_pass http://localhost:5173/covers/;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /presets/ {
        proxy_pass http://localhost:5173/presets/;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /textures/ {
        proxy_pass http://localhost:5173/textures/;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Admin UI 图片文件
    location ~ ^/(.*\.(png|jpg|jpeg|gif|svg|ico))$ {
        proxy_pass http://localhost:5173/$1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 公开展示端 (Viewer UI)
    location /g/ {
        proxy_pass http://localhost:5174/g/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 根路径重定向到管理端
    location = / {
        return 302 /app/;
    }
}
