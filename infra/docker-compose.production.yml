services:
  mysql:
    image: mysql:8.0
    container_name: vie-gallery-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-vie_gallery_root_2026}
      MYSQL_DATABASE: vie_gallery
      MYSQL_USER: vie_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-vie_password_2026}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    networks:
      - vie-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uvie_user", "-p${MYSQL_PASSWORD:-vie_password_2026}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vie-gallery-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - vie-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    container_name: vie-gallery-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - vie-network
    command: server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  api:
    image: vie-gallery-api:latest
    container_name: vie-gallery-api
    ports:
      - "8088:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Database
      DB_URL: jdbc:mysql://mysql:3306/vie_gallery?useSSL=false&serverTimezone=UTC&characterEncoding=utf8
      DB_USERNAME: vie_user
      DB_PASSWORD: ${MYSQL_PASSWORD:-vie_password_2026}
      # Redis
      REDIS_URL: redis://redis:6379
      # Storage (MinIO)
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-http://gallery.vie-vibe.cn:9000}
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-vie-gallery}
      # URLs
      ADMIN_PUBLIC_BASE_URL: ${ADMIN_PUBLIC_BASE_URL:-http://gallery.vie-vibe.cn/app}
      GALLERY_PUBLIC_BASE_URL: ${GALLERY_PUBLIC_BASE_URL:-http://gallery.vie-vibe.cn/g}
      # Mail (optional - use dummy values for now)
      MAIL_HOST: ${MAIL_HOST:-localhost}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@vie-vibe.cn}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-false}
    networks:
      - vie-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  admin:
    image: nginx:alpine
    container_name: vie-gallery-admin
    ports:
      - "5173:80"
    volumes:
      - ../admin:/usr/share/nginx/html
      - ./nginx-admin.conf:/etc/nginx/conf.d/default.conf
    networks:
      - vie-network
    restart: unless-stopped

  viewer:
    image: nginx:alpine
    container_name: vie-gallery-viewer
    ports:
      - "5174:80"
    volumes:
      - ../viewer:/usr/share/nginx/html
      - ./nginx-viewer.conf:/etc/nginx/conf.d/default.conf
    networks:
      - vie-network
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  minio-data:

networks:
  vie-network:
    driver: bridge
