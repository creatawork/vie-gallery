# HTTP server - redirect to HTTPS
server {
    listen 80;
    server_name gallery.vie-vibe.cn;

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name gallery.vie-vibe.cn;

    # SSL certificate files (will be created by certbot)
    ssl_certificate /etc/letsencrypt/live/gallery.vie-vibe.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gallery.vie-vibe.cn/privkey.pem;

    # SSL configuration - modern secure settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    # SSL session settings
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/gallery.vie-vibe.cn/chain.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    client_max_body_size 100M;

    # Compress the actual /app/assets and /g/assets JavaScript responses.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/javascript text/javascript text/css image/svg+xml;

    # API 后端
    # Fixed upstream only: signed OSS reads without browser CORS restrictions.
    location ^~ /oss/ {
        limit_except GET HEAD { deny all; }
        proxy_pass https://vie-gallery.oss-cn-hangzhou.aliyuncs.com/;
        proxy_ssl_server_name on;
        proxy_ssl_name vie-gallery.oss-cn-hangzhou.aliyuncs.com;
        proxy_set_header Host vie-gallery.oss-cn-hangzhou.aliyuncs.com;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header Referer "https://gallery.vie-vibe.cn/";
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        proxy_cache off;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location /api/ {
        proxy_pass http://localhost:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 大图片上传需要更长的超时
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 短链接公开重定向（GET /s/{shortCode} -> 302）
    location /s/ {
        proxy_pass http://localhost:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Content-hashed build assets are safe to retain across visits. Missing
    # chunks must return 404, never the SPA HTML fallback.
    location ^~ /app/assets/ {
        alias /home/ubuntu/vie-gallery/admin/assets/;
        expires 1y;
    }

    location ^~ /g/assets/ {
        alias /home/ubuntu/vie-gallery/viewer/assets/;
        expires 1y;
    }

    # Builtin backgrounds use versioned query strings when their content changes.
    location ^~ /g/backgrounds/ {
        alias /home/ubuntu/vie-gallery/viewer/backgrounds/;
        expires 7d;
    }

    # 管理端 (Admin UI) - 静态文件服务
    location /app/ {
        alias /home/ubuntu/vie-gallery/admin/;
        index index.html;
        expires -1;
        error_page 404 = /app/index.html;
    }
    
    location = /app {
        return 301 /app/;
    }

    # 公开展示端 (Viewer UI) - 静态文件服务  
    location /g/ {
        alias /home/ubuntu/vie-gallery/viewer/;
        index index.html;
        expires -1;
        error_page 404 = /g/index.html;
    }
    
    location = /g {
        return 301 /g/;
    }

    location = /site {
        return 410;
    }

    location ^~ /site/ {
        return 410;
    }

    # 根路径重定向到管理端
    location = / {
        return 302 /app/;
    }
}
